name: Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
          github-token: ""

      - name: Sync from the lockfile
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
          github-token: ""

      - name: Sync from the lockfile
        run: uv sync --frozen

      - name: Test
        run: uv run pytest

  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
          github-token: ""

      - name: Sync from the lockfile
        run: uv sync --frozen

      - name: Validate the corpus
        run: uv run patchpilot-evals corpus-validation

      - name: Evaluate the deterministic baseline
        run: uv run patchpilot-evals baseline-evaluation

      - name: Validate candidate manifests
        run: |
          for manifest in candidates/fixtures/*/manifest.json; do
            uv run patchpilot-evals candidate-manifest-validation --manifest "$manifest"
          done

      - name: Evaluate the conforming candidate
        run: uv run patchpilot-evals candidate-evaluation --manifest candidates/fixtures/conforming/manifest.json --output-dir build/ci-conforming

      - name: Evaluate faulty quality fixtures
        run: |
          for fixture in unsupported-claim prompt-injection-following cross-tenant-leaking; do
            uv run patchpilot-evals candidate-evaluation --manifest "candidates/fixtures/${fixture}/manifest.json" --output-dir "build/ci-${fixture}"
          done

      - name: Execute operational fixtures
        run: |
          for fixture in timeout malformed-output excessive-output nonzero-exit; do
            uv run patchpilot-evals candidate-execution --manifest "candidates/fixtures/${fixture}/manifest.json" --case-id case-ground-001 --output-dir "build/ci-${fixture}"
          done

      - name: Validate calibration
        run: uv run patchpilot-evals calibration --output-dir build/ci-calibration

      - name: Validate candidate artifacts
        run: |
          set -eu
          find build/ci-conforming build/ci-unsupported-claim build/ci-prompt-injection-following build/ci-cross-tenant-leaking build/ci-timeout build/ci-malformed-output build/ci-excessive-output build/ci-nonzero-exit -name candidate-execution-result.json | while read -r result; do
            uv run patchpilot-evals result-validation --result "$result"
          done
          left=$(find build/ci-conforming -name candidate-execution-result.json)
          right=$(find build/ci-unsupported-claim -name candidate-execution-result.json)
          uv run patchpilot-evals candidate-comparison --left "$left" --right "$right" --output-dir build/ci-comparison
          comparison=$(find build/ci-comparison -name 'comparison-*.json')
          uv run patchpilot-evals comparison-validation --result "$comparison"
          record=$(find build/ci-calibration -name calibration-record.json)
          uv run patchpilot-evals calibration-validation --result "$record"

      - name: Validate the real-candidate boundary
        run: |
          uv run patchpilot-evals real-candidate-manifest-validation --manifest candidates/templates/offline-local-model-manifest.json
          uv run patchpilot-evals artifact-cache-policy-validation
          uv run patchpilot-evals artifact-verification-validation --manifest candidates/templates/model-artifact-verification-template.json
          uv run patchpilot-evals runtime-assessment-validation
          uv run patchpilot-evals runtime-authorization-validation
          uv run patchpilot-evals isolation-profile-validation
          uv run patchpilot-evals evidence-closure-validation
          uv run patchpilot-evals track6-authorization-validation
          uv run patchpilot-evals track5-review-validation

      - name: Validate the hardened execution records
        run: |
          uv run patchpilot-evals sandbox-capability-validation
          uv run patchpilot-evals hardened-execution-profile-validation
          uv run patchpilot-evals execution-attestation-validation
          uv run patchpilot-evals runtime-security-assessment-validation
          uv run patchpilot-evals runtime-authorization-v2-validation
          uv run patchpilot-evals track6b-readiness-validation
          uv run patchpilot-evals track6a-review-validation

      - name: Validate the Track 6B staging records
        run: |
          uv run patchpilot-evals external-runtime-cache-policy-validation
          uv run patchpilot-evals runtime-artifact-verification-validation --manifest candidates/templates/runtime-artifact-verification-template.json
          uv run patchpilot-evals runtime-adapter-contract-validation
          uv run patchpilot-evals candidate-format-resolution-validation
          uv run patchpilot-evals onnx-conversion-plan-validation
          uv run patchpilot-evals track6c-readiness-validation

      - name: Validate the Track 6C eligibility records
        run: |
          uv run patchpilot-evals candidate-eligibility-validation
          uv run patchpilot-evals tokenizer-eligibility-validation
          uv run patchpilot-evals direct-onnx-evidence-validation
          uv run patchpilot-evals artifact-budget-validation
          uv run patchpilot-evals bounded-subprocess-compatibility-validation
          uv run patchpilot-evals track6d-readiness-validation

      - name: Validate the Track 7 candidate records
        run: |
          uv run patchpilot-evals candidate-discovery-validation
          uv run patchpilot-evals finalist-eligibility-validation
          uv run patchpilot-evals finalist-tokenizer-validation
          uv run patchpilot-evals finalist-direct-onnx-validation
          uv run patchpilot-evals finalist-artifact-budget-validation
          uv run patchpilot-evals finalist-explanation-suitability-validation
          uv run patchpilot-evals track7-selection-validation
          uv run patchpilot-evals track8-acquisition-authorization-validation
          uv run patchpilot-evals track7-review-validation

      - name: Validate the Track 7A storage records
        run: |
          uv run patchpilot-evals artifact-storage-policy-validation
          uv run patchpilot-evals artifact-verification-seal-validation
          uv run patchpilot-evals artifact-promotion-attempt-validation
          uv run patchpilot-evals artifact-promotion-receipt-validation
          uv run patchpilot-evals artifact-recovery-decision-validation
          uv run patchpilot-evals artifact-budget-recalculation-validation
          uv run patchpilot-evals track8a-storage-readiness-validation
          uv run patchpilot-evals track7a-review-validation
          uv run patchpilot-evals storage-safety-synthetic-check

      - name: Validate the Track 7B evidence records
        run: |
          uv run patchpilot-evals candidate-memory-model-validation
          uv run patchpilot-evals candidate-memory-evidence-validation
          uv run patchpilot-evals candidate-memory-budget-validation
          uv run patchpilot-evals explanation-suitability-contract-validation
          uv run patchpilot-evals explanation-suitability-evidence-validation
          uv run patchpilot-evals controlled-measurement-authorization-validation
          uv run patchpilot-evals track8b-readiness-validation
          uv run patchpilot-evals track7b-review-validation

      - name: Validate the Track 8A acquisition records
        run: |
          uv run patchpilot-evals acquisition-plan-validation
          uv run patchpilot-evals acquisition-allowlist-validation
          uv run patchpilot-evals acquired-runtime-manifest-validation
          uv run patchpilot-evals acquired-candidate-manifest-validation
          uv run patchpilot-evals local-artifact-digests-validation
          uv run patchpilot-evals hardened-load-attestation-validation
          uv run patchpilot-evals acquisition-closeout-validation
          uv run patchpilot-evals track8a-acquisition-evidence-validation
          uv run patchpilot-evals track8a-review-validation
          uv run patchpilot-evals track8b-measurement-prerequisites-validation

      - name: Validate the Track 8B measurement records
        run: |
          uv run patchpilot-evals measurement-plan-validation
          uv run patchpilot-evals measurement-operator-approval-validation
          uv run patchpilot-evals smoke-execution-validation
          uv run patchpilot-evals context-memory-measurement-validation
          uv run patchpilot-evals candidate-behavioral-run-validation
          uv run patchpilot-evals candidate-behavioral-summary-validation
          uv run patchpilot-evals measurement-closeout-validation
          uv run patchpilot-evals track8b-preflight-validation
          uv run patchpilot-evals track8b-stopped-attempt-validation
          uv run patchpilot-evals track8b-plan-disposition-validation
          uv run patchpilot-evals track8b-template-compatibility-defect-validation
          uv run patchpilot-evals track8b-review-validation
          uv run patchpilot-evals track9-readiness-validation

      - name: Validate the Track 8B-R1 retry records
        run: |
          uv run patchpilot-evals measurement-retry-plan-validation
          uv run patchpilot-evals measurement-retry-approval-validation
          uv run patchpilot-evals measurement-retry-preflight-validation
          uv run patchpilot-evals template-compatibility-result-validation
          uv run patchpilot-evals retry-smoke-execution-validation
          uv run patchpilot-evals retry-context-memory-validation
          uv run patchpilot-evals retry-behavioral-run-validation
          uv run patchpilot-evals retry-closeout-validation
          uv run patchpilot-evals retry-track9-readiness-validation
          uv run patchpilot-evals track8b-r1-stopped-attempt-validation
          uv run patchpilot-evals track8b-r1-dependency-mount-defect-validation
          uv run patchpilot-evals track8b-r1-memory-conclusion-defect-validation
          uv run patchpilot-evals track8b-r1-corrected-closeout-validation
          uv run patchpilot-evals track8b-r1-plan-disposition-validation
          uv run patchpilot-evals track8b-r1-stopped-track9-validation
          uv run patchpilot-evals track8b-r1-review-validation

      - name: Validate the Track 8B-R2 inference retry records
        run: |
          uv run patchpilot-evals inference-retry-plan-validation
          uv run patchpilot-evals inference-retry-approval-validation
          uv run patchpilot-evals inference-retry-preflight-validation
          uv run patchpilot-evals dynamic-link-precheck-validation
          uv run patchpilot-evals inference-retry-smoke-validation
          uv run patchpilot-evals inference-retry-context-memory-validation
          uv run patchpilot-evals inference-retry-behavioral-run-validation
          uv run patchpilot-evals inference-retry-closeout-validation
          uv run patchpilot-evals inference-retry-track9-readiness-validation
          uv run patchpilot-evals track8b-r2-stopped-attempt-validation
          uv run patchpilot-evals track8b-r2-cgroup-sampling-defect-validation
          uv run patchpilot-evals track8b-r2-schema-forensics-validation
          uv run patchpilot-evals track8b-r2-behavioral-interpretation-validation
          uv run patchpilot-evals track8b-r2-memory-conclusion-validation
          uv run patchpilot-evals track8b-r2-plan-disposition-validation
          uv run patchpilot-evals track8b-r2-proportionality-review-validation
          uv run patchpilot-evals track8b-r2-stopped-track9-validation
          uv run patchpilot-evals track8b-r2-review-validation

      - name: Validate the Track 9 evidence review
        run: |
          uv run patchpilot-evals evaluation-evidence-inventory-validation
          uv run patchpilot-evals memory-evidence-review-validation
          uv run patchpilot-evals behavioral-evidence-review-validation
          uv run patchpilot-evals proportionality-decision-validation
          uv run patchpilot-evals corpus-continuation-authorization-validation
          uv run patchpilot-evals candidate-disposition-validation
          uv run patchpilot-evals track9-implementation-review-validation

      - name: Validate the Track 9A corpus continuation
        run: |
          uv run patchpilot-evals corpus-continuation-plan-validation
          uv run patchpilot-evals corpus-continuation-approval-validation
          uv run patchpilot-evals corpus-continuation-preflight-validation
          uv run patchpilot-evals bounded-raw-output-validation
          uv run patchpilot-evals run-diagnostics-validation
          uv run patchpilot-evals corpus-continuation-run-validation
          uv run patchpilot-evals corpus-continuation-summary-validation
          uv run patchpilot-evals corpus-continuation-closeout-validation
          uv run patchpilot-evals track10-readiness-validation
          uv run patchpilot-evals track9a-stopped-attempt-validation
          uv run patchpilot-evals track9a-telemetry-finalization-defect-validation
          uv run patchpilot-evals track9a-schema-forensics-validation
          uv run patchpilot-evals track9a-corrected-interpretation-validation
          uv run patchpilot-evals track9a-plan-disposition-validation
          uv run patchpilot-evals track9a-proportionality-review-validation
          uv run patchpilot-evals track9a-track10-not-ready-validation
          uv run patchpilot-evals track9a-implementation-review-validation

      - name: Validate the Track 10 candidate disposition
        run: |
          uv run patchpilot-evals attributed-response-evidence-validation
          uv run patchpilot-evals schema-invariant-review-validation
          uv run patchpilot-evals diagnostic-proportionality-validation
          uv run patchpilot-evals six-run-diagnostic-authorization-validation
          uv run patchpilot-evals investment-stop-decision-validation
          uv run patchpilot-evals track10-candidate-disposition-validation
          uv run patchpilot-evals track10-implementation-review-validation

      - name: Validate workflow policy
        run: uv run patchpilot-evals workflow-policy-validation

      - name: Validate dependency architecture policy
        run: uv run patchpilot-evals dependency-architecture-policy-validation
