name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
          github-token: ""

      - name: Sync from the lockfile
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Validate the corpus
        run: uv run patchpilot-evals corpus-validation

      - name: Evaluate the deterministic baseline
        run: uv run patchpilot-evals baseline-evaluation

      - name: Validate candidate manifests
        run: |
          for manifest in candidates/fixtures/*/manifest.json; do
            uv run patchpilot-evals candidate-manifest-validation --manifest "$manifest"
          done

      - name: Evaluate the conforming candidate
        run: uv run patchpilot-evals candidate-evaluation --manifest candidates/fixtures/conforming/manifest.json --output-dir build/ci-conforming

      - name: Evaluate faulty quality fixtures
        run: |
          for fixture in unsupported-claim prompt-injection-following cross-tenant-leaking; do
            uv run patchpilot-evals candidate-evaluation --manifest "candidates/fixtures/${fixture}/manifest.json" --output-dir "build/ci-${fixture}"
          done

      - name: Execute operational fixtures
        run: |
          for fixture in timeout malformed-output excessive-output nonzero-exit; do
            uv run patchpilot-evals candidate-execution --manifest "candidates/fixtures/${fixture}/manifest.json" --case-id case-ground-001 --output-dir "build/ci-${fixture}"
          done

      - name: Validate calibration
        run: uv run patchpilot-evals calibration --output-dir build/ci-calibration

      - name: Validate candidate artifacts
        run: |
          set -eu
          find build/ci-conforming build/ci-unsupported-claim build/ci-prompt-injection-following build/ci-cross-tenant-leaking build/ci-timeout build/ci-malformed-output build/ci-excessive-output build/ci-nonzero-exit -name candidate-execution-result.json | while read -r result; do
            uv run patchpilot-evals result-validation --result "$result"
          done
          left=$(find build/ci-conforming -name candidate-execution-result.json)
          right=$(find build/ci-unsupported-claim -name candidate-execution-result.json)
          uv run patchpilot-evals candidate-comparison --left "$left" --right "$right" --output-dir build/ci-comparison
          comparison=$(find build/ci-comparison -name 'comparison-*.json')
          uv run patchpilot-evals comparison-validation --result "$comparison"
          record=$(find build/ci-calibration -name calibration-record.json)
          uv run patchpilot-evals calibration-validation --result "$record"

      - name: Validate the real-candidate boundary
        run: |
          uv run patchpilot-evals real-candidate-manifest-validation --manifest candidates/templates/offline-local-model-manifest.json
          uv run patchpilot-evals artifact-cache-policy-validation
          uv run patchpilot-evals artifact-verification-validation --manifest candidates/templates/model-artifact-verification-template.json
          uv run patchpilot-evals runtime-assessment-validation
          uv run patchpilot-evals runtime-authorization-validation
          uv run patchpilot-evals isolation-profile-validation
          uv run patchpilot-evals evidence-closure-validation
          uv run patchpilot-evals track6-authorization-validation
          uv run patchpilot-evals track5-review-validation

      - name: Validate the hardened execution records
        run: |
          uv run patchpilot-evals sandbox-capability-validation
          uv run patchpilot-evals hardened-execution-profile-validation
          uv run patchpilot-evals execution-attestation-validation
          uv run patchpilot-evals runtime-security-assessment-validation
          uv run patchpilot-evals runtime-authorization-v2-validation
          uv run patchpilot-evals track6b-readiness-validation
          uv run patchpilot-evals track6a-review-validation

      - name: Validate the Track 6B staging records
        run: |
          uv run patchpilot-evals external-runtime-cache-policy-validation
          uv run patchpilot-evals runtime-artifact-verification-validation --manifest candidates/templates/runtime-artifact-verification-template.json
          uv run patchpilot-evals runtime-adapter-contract-validation
          uv run patchpilot-evals candidate-format-resolution-validation
          uv run patchpilot-evals onnx-conversion-plan-validation
          uv run patchpilot-evals track6c-readiness-validation

      - name: Validate the Track 6C eligibility records
        run: |
          uv run patchpilot-evals candidate-eligibility-validation
          uv run patchpilot-evals tokenizer-eligibility-validation
          uv run patchpilot-evals direct-onnx-evidence-validation
          uv run patchpilot-evals artifact-budget-validation
          uv run patchpilot-evals bounded-subprocess-compatibility-validation
          uv run patchpilot-evals track6d-readiness-validation
