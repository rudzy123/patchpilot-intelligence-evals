[project]
name = "patchpilot-intelligence-evals"
version = "0.0.0"
description = "Offline synthetic evaluation harness for PatchPilot intelligence experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
patchpilot-evals = "patchpilot_intelligence_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1", "mypy>=1.13,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["patchpilot_intelligence_evals"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
